name: release

# Builds ElmerFront for each supported platform and attaches the archives to
# the release for the tag that triggered it.
#
# There is no single artifact that runs everywhere: this is native code linked
# against OpenGL and Tcl/Tk. Each archive carries the program plus the Tcl
# scripts and definition files it reads at run time, because without those it
# starts and can then do nothing.
#
# macOS is absent, and not for want of trying: ElmerFront's non-Windows path is
# an X11 program and macOS has no X11. The README says why in full.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x86_64
            os: windows-2022
            mingw: true
            msystem: UCRT64
            msys-prefix: ucrt64
            msys-packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-tcl
              mingw-w64-ucrt-x86_64-tk
          - target: windows-arm64
            os: windows-11-arm
            mingw: true
            msystem: CLANGARM64
            msys-prefix: clangarm64
            msys-packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-tcl
              mingw-w64-clang-aarch64-tk
          # macOS, through XQuartz. The archive carries the X11 Tcl/Tk it was
          # built against; XQuartz itself is a system component and must be
          # installed on the machine that runs it.
          - target: macos-arm64
            os: macos-14
            macos-x11: true
          - target: macos-x86_64
            os: macos-15-intel
            macos-x11: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev tcl-dev tk-dev libx11-dev

      - name: dependencies (mingw)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.msys-packages }}

      # Same XQuartz and X11 Tcl/Tk recipe used in ci.yml and in
      # AltElmer/ElmerPost, including the check that the Tk actually links
      # libX11 rather than quietly coming out as Homebrew's Aqua build.
      - name: cache the X11 Tcl/Tk (macos)
        if: matrix.macos-x11
        id: tcltk-cache
        uses: actions/cache@v4
        with:
          path: ~/tcltk-x11
          key: tcltk-x11-8.6.14-${{ matrix.os }}-v1

      - name: xquartz and an X11 Tcl/Tk (macos)
        if: matrix.macos-x11
        run: |
          set -e
          brew install --cask xquartz
          test -f /opt/X11/include/GL/gl.h || { echo "::error::XQuartz did not provide GL/gl.h"; exit 1; }
          PREFIX="$HOME/tcltk-x11"
          if [ ! -f "$PREFIX/include/tk.h" ]; then
            V=8.6.14
            mkdir -p "$RUNNER_TEMP/tcltk" && cd "$RUNNER_TEMP/tcltk"
            curl -fsSL -o tcl.tar.gz "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tcl$V-src.tar.gz"
            curl -fsSL -o tk.tar.gz  "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tk$V-src.tar.gz"
            tar xzf tcl.tar.gz && tar xzf tk.tar.gz
            ( cd "tcl$V/unix" && ./configure --prefix="$PREFIX" >/dev/null && make -j3 >/dev/null && make install >/dev/null )
            ( cd "tk$V/unix" && ./configure --prefix="$PREFIX" --with-tcl="$PREFIX/lib" \
                --enable-aqua=no --x-includes=/opt/X11/include --x-libraries=/opt/X11/lib >/dev/null \
              && make -j3 >/dev/null && make install >/dev/null )
          fi
          tklib=$(ls "$PREFIX"/lib/libtk8.6* | head -1)
          otool -L "$tklib" | grep -qi 'libX11' \
            || { echo "::error::Tk is not the X11 build"; otool -L "$tklib"; exit 1; }
          tcllib=$(ls "$PREFIX"/lib/libtcl8.6* | head -1)
          {
            echo "MAC_TCLTK_ARGS=-DTCL_INCLUDE_PATH=$PREFIX/include -DTK_INCLUDE_PATH=$PREFIX/include -DTCL_LIBRARY=$tcllib -DTK_LIBRARY=$tklib -DTCL_TCLSH=$PREFIX/bin/tclsh8.6 -DOPENGL_INCLUDE_DIR=/opt/X11/include -DOPENGL_gl_LIBRARY=/opt/X11/lib/libGL.dylib -DOPENGL_glu_LIBRARY=/opt/X11/lib/libGLU.dylib"
            echo "MAC_TCLTK_PREFIX=$PREFIX"
          } >> "$GITHUB_ENV"

      - name: build and test
        if: '!matrix.mingw'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/elmerfront-${{ matrix.target }}" ${MAC_TCLTK_ARGS:-}
          if [ -n "${MAC_TCLTK_PREFIX:-}" ]; then
            used=$(grep -E '^(TCL|TK)_(LIBRARY|INCLUDE_PATH):' build/CMakeCache.txt || true)
            echo "$used"
            echo "$used" | grep -qi 'framework' \
              && { echo "::error::configure picked Apple's Tcl/Tk framework"; exit 1; }
          fi
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build

      # The Tcl/Tk built for this job lives in the runner's home directory, so
      # an archive that merely linked against it would run nowhere else.
      - name: bundle the macos libraries
        if: matrix.macos-x11
        shell: bash
        run: |
          set -e
          d="dist/elmerfront-${{ matrix.target }}"
          libdir="$d/lib/bundled"
          mkdir -p "$libdir" "$d/lib"
          cp -f "$MAC_TCLTK_PREFIX"/lib/libtcl8.6* "$MAC_TCLTK_PREFIX"/lib/libtk8.6* "$libdir/" 2>/dev/null || true
          chmod u+w "$libdir"/* 2>/dev/null || true
          cp -r "$MAC_TCLTK_PREFIX"/lib/tcl8.6 "$MAC_TCLTK_PREFIX"/lib/tk8.6 "$d/lib/" 2>/dev/null || true
          for bin in $(find "$d" -type f -perm -u+x); do
            file "$bin" | grep -qi 'Mach-O.*executable' || continue
            otool -L "$bin" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in "$MAC_TCLTK_PREFIX"/*) ;; *) continue ;; esac
              install_name_tool -change "$dep" "@executable_path/../lib/bundled/$(basename "$dep")" "$bin" 2>/dev/null || true
            done
          done
          # An archive that runs only on the machine that built it is worse
          # than no archive, because it looks like one.
          for bin in $(find "$d" -type f -perm -u+x); do
            file "$bin" | grep -qi 'Mach-O.*executable' || continue
            if otool -L "$bin" | grep -q "$MAC_TCLTK_PREFIX"; then
              echo "::error::$bin still references $MAC_TCLTK_PREFIX"; otool -L "$bin"; exit 1
            fi
          done
          echo "ok: nothing points at the build machine's home directory"

      - name: build and test (mingw)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist/elmerfront-${{ matrix.target }}
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build

      # The archive has to run on a machine that has never seen MSYS2.
      # Resolved with ldd rather than listed by hand, so a dependency added
      # later is picked up instead of missed.
      - name: bundle the windows runtime
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -e
          d="dist/elmerfront-${{ matrix.target }}/bin"
          mkdir -p "$d"
          echo "bundling into $d"
          ls -l "$d" || true

          # objdump, not ldd. ldd lives in MSYS2's msys environment and this
          # job installs only the UCRT64 packages it asks for, so ldd was
          # simply absent: the step died on its first command under set -e,
          # before reaching any echo, and reported exit 1 with no output at
          # all. objdump comes with binutils alongside the compiler.
          #
          # Repeated until nothing new is copied, because the DLLs have
          # dependencies of their own and one pass only catches the first
          # level.
          pass=0
          while : ; do
            pass=$((pass+1))
            before=$(find "$d" -maxdepth 1 -name '*.dll' | wc -l)
            for bin in "$d"/*.exe "$d"/*.dll; do
              [ -f "$bin" ] || continue
              objdump -p "$bin" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
                [ -f "/${{ matrix.msys-prefix }}/bin/$dll" ] || continue
                cp -n "/${{ matrix.msys-prefix }}/bin/$dll" "$d/" 2>/dev/null || true
              done
            done
            after=$(find "$d" -maxdepth 1 -name '*.dll' | wc -l)
            echo "pass $pass: $before -> $after DLLs"
            [ "$after" -gt "$before" ] || break
            [ "$pass" -lt 8 ] || break
          done
          # Tcl and Tk load their own script libraries at run time, so the DLLs
          # alone are not enough. The directories are versioned, so they are
          # found rather than named: an earlier version of this hard-coded
          # tcl8.6 and tk8.6 and failed the whole job when the copy did not
          # match.
          libdst="dist/elmerfront-${{ matrix.target }}/lib"
          mkdir -p "$libdst"
          found=0
          for d2 in /${{ matrix.msys-prefix }}/lib/tcl[0-9]* /${{ matrix.msys-prefix }}/lib/tk[0-9]*; do
            [ -d "$d2" ] || continue
            cp -r "$d2" "$libdst/" && found=$((found+1))
          done
          echo "tcl/tk script libraries copied: $found"
          [ "$found" -ge 2 ] || { echo "::error::expected a tcl and a tk script library, found $found"; exit 1; }
          echo "bundled DLLs: $(find "$d" -maxdepth 1 -name '*.dll' | wc -l)"

      - name: package
        shell: bash
        run: |
          set -e
          d="dist/elmerfront-${{ matrix.target }}"
          mkdir -p "$d"
          cp README.md "$d/" 2>/dev/null || true

          # An archive without the program, or without the Tcl scripts it loads
          # at startup, is worse than a failed build because it looks like a
          # release. Checked before anything is uploaded.
          exe=$(find "$d" -name 'ElmerFront' -type f -o -name 'ElmerFront.exe' -type f | head -1)
          [ -n "$exe" ] || { echo "::error::no ElmerFront binary in the archive"; exit 1; }
          find "$d" -name 'ecif_tcl_mainScript.tcl' | grep -q . \
            || { echo "::error::no tcl scripts in the archive; ElmerFront would start and do nothing"; exit 1; }

          # An archive can contain the script and the program still not find
          # it. The v5.5.0 Windows archive did exactly that: the file was
          # present under share/elmerfront/tcl and the binary looked only in
          # the working directory and at an absolute path fixed at build time,
          # so it wrote "Script ecif_tcl_mainScript.tcl not found!" and quit.
          # The check above passed the whole time, because it asked whether
          # the file existed rather than whether the program could use it.
          #
          # So: run it, from a directory that is not its own, and require that
          # it gets past the script search.
          echo "--- running from an unrelated working directory ---"
          runlog="$RUNNER_TEMP/elmerfront-run.log"
          abs_exe=$(cd "$(dirname "$exe")" && pwd)/$(basename "$exe")

          # No timeout(1). It is GNU coreutils and macOS does not have it, so
          # the command never ran there and the log contained the shell's own
          # "timeout: command not found". The check below then matched that
          # against a bare grep for "not found" and reported that the program
          # could not find its scripts, which is a verifier diagnosing its own
          # failure as the fault it was looking for. Backgrounded and killed
          # instead, which works the same everywhere.
          ( cd "$RUNNER_TEMP" && "$abs_exe" > "$runlog" 2>&1 & echo $! > "$RUNNER_TEMP/ef.pid" ) || true
          sleep 20
          if [ -f "$RUNNER_TEMP/ef.pid" ]; then kill "$(cat "$RUNNER_TEMP/ef.pid")" 2>/dev/null || true; fi
          echo "--- output ---"; cat "$runlog" 2>/dev/null || true; echo "--- end ---"

          # The program has to have run at all. An empty log means the launch
          # failed and nothing below would be meaningful.
          [ -s "$runlog" ] || { echo "::error::the program produced no output; it did not run"; exit 1; }

          # The specific message, not a bare "not found" that any unrelated
          # error can satisfy.
          if grep -q 'Script ecif_tcl_mainScript.tcl not found' "$runlog"; then
            echo "::error::the program could not find its scripts when run from elsewhere"
            exit 1
          fi

          # Positive evidence that the executable-relative search is the one
          # that found them: the path the program reports has to name the
          # install directory, which the working directory it was launched
          # from does not.
          #
          # Matched on the install directory's own name rather than on its
          # full path. The full path cannot be compared across a shell and a
          # native Windows program: the program prints what GetModuleFileNameA
          # gave it, D:\a\...\elmerfront-windows-x86_64\bin/../share/...,
          # while $(cd "$d" && pwd) in MSYS is /d/a/.../elmerfront-windows-x86_64.
          # Those never match, so this check failed on Windows while the log
          # sitting next to it showed the program finding its scripts exactly
          # as intended. A directory name carries the same evidence and does
          # not depend on which of the two spellings a path arrives in.
          start=$(grep -m1 '^Start script=' "$runlog" || true)
          [ -n "$start" ] || { echo "::error::the program never reported which script it started"; exit 1; }
          echo "reported: $start"

          case "$start" in
            *"$(basename "$d")"*) ;;
            *) echo "::error::the program never looked inside its own installation"; exit 1 ;;
          esac

          # And it must not have been satisfied by the working directory. The
          # first candidates the program tries are ./ relative, so a run that
          # picked one of those would report a path starting with "./" -- which
          # is what happened before the executable-relative search existed, and
          # is the case this whole job is here to catch.
          case "$start" in
            "Start script=./"*)
              echo "::error::it used a path relative to the working directory, not to itself"
              exit 1 ;;
          esac

          # The control. If the program did not try the working directory
          # first, then the check above could pass without ever having been
          # able to fail, and this job would be proving nothing.
          grep -q '^Trying \./' "$runlog" \
            || { echo "::error::the program never tried a working-directory path, so the check above is vacuous"; exit 1; }

          echo "ok: finds its scripts relative to the executable, from any directory"
          echo "binary: $exe"
          { ls -lR "$d" || true; } | head -40 || true

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "elmerfront-${{ matrix.target }}.zip" "elmerfront-${{ matrix.target }}"
          else
            tar czf "elmerfront-${{ matrix.target }}.tar.gz" "elmerfront-${{ matrix.target }}"
          fi

      # A single self-contained .exe, alongside the archive.
      #
      # Tcl/Tk cannot be linked statically here: MSYS2 ships only import
      # libraries and a stub, and this Tcl 8.6 has no zipfs to embed the
      # script libraries with. So the program cannot be reduced to one file by
      # linking. What it can be is one file to download and one file to
      # double-click, which is what was actually asked for: the tree is
      # compressed and appended to a launcher that unpacks it to a temporary
      # directory and runs the program.
      #
      # 7zSD.sfx is the launcher. It comes from the LZMA SDK, not from the
      # normal 7-Zip installation and not from 7-Zip Extra, whose current
      # release no longer carries it: the 7z.sfx in a normal install is a
      # plain extractor with no RunProgram support, and using it produces an
      # "Extract to:" dialog instead of starting the program.
      - name: build a single-file executable
        if: matrix.mingw
        shell: bash
        run: |
          set -e
          name="ElmerFront"
          d="dist/elmerfront-${{ matrix.target }}"
          sdk="$RUNNER_TEMP/lzmasdk"
          mkdir -p "$sdk"

          curl -fsSL -o "$sdk/sdk.7z" https://www.7-zip.org/a/lzma2301.7z
          7z x "$sdk/sdk.7z" -o"$sdk" -y > /dev/null
          sfx=$(find "$sdk" -name '7zSD.sfx' | head -1)
          [ -n "$sfx" ] || { echo "::error::7zSD.sfx not found in the LZMA SDK"; exit 1; }
          echo "launcher: $sfx ($(stat -c%s "$sfx" 2>/dev/null || stat -f%z "$sfx") bytes)"

          7z a -t7z -mx=9 "$RUNNER_TEMP/payload.7z" "./$d/*" > /dev/null

          printf ';!@Install@!UTF-8!\nTitle="%s"\nRunProgram="bin\\\\%s.exe"\nGUIMode="2"\n;!@InstallEnd@!\n' \
            "$name" "$name" > "$RUNNER_TEMP/sfx-config.txt"

          mkdir -p dist
          cat "$sfx" "$RUNNER_TEMP/sfx-config.txt" "$RUNNER_TEMP/payload.7z" \
            > "dist/$name-${{ matrix.target }}.exe"

          # The launcher on its own is about 125 kB, so a result that size
          # means the payload never made it. Reading the archive back is the
          # check that matters: 7z can list an SFX, and the program has to be
          # in there.
          sz=$(stat -c%s "dist/$name-${{ matrix.target }}.exe" 2>/dev/null || stat -f%z "dist/$name-${{ matrix.target }}.exe")
          echo "single-file executable: $sz bytes"
          [ "$sz" -gt 1000000 ] || { echo "::error::the single-file exe is too small to contain the payload"; exit 1; }
          7z l "dist/$name-${{ matrix.target }}.exe" | grep -qi "$name.exe" \
            || { echo "::error::the payload does not contain $name.exe"; exit 1; }
          echo "ok: single-file executable carries the program"

      - uses: actions/upload-artifact@v4
        with:
          name: elmerfront-${{ matrix.target }}
          path: |
            dist/elmerfront-*.*
            dist/ElmerFront-*.exe
          if-no-files-found: error

  publish:
    needs: build
    # always(), so a platform that fails does not withhold the platforms that
    # worked. A release with four of six archives is useful; a release with
    # none because one target broke is not. The publish step below fails if
    # nothing at all was produced.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list what will be published
        run: ls -lR dist

      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/elmerfront-*.*
            dist/**/ElmerFront-*.exe
