name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full program: core library, OpenGL renderer, Tcl/Tk interface, and a
  # start-up test.
  gui:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64 (gcc)
            os: ubuntu-24.04
          - name: linux-arm64 (gcc)
            os: ubuntu-24.04-arm
          - name: linux-x86_64 (clang)
            os: ubuntu-24.04
            cmake-extra: -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
            apt-clang: true
          - name: linux-x86_64 (intel icpx)
            os: ubuntu-24.04
            intel: true
            cmake-extra: -DCMAKE_CXX_COMPILER=icpx -DCMAKE_C_COMPILER=icx
          - name: windows-x86_64 (mingw)
            os: windows-2022
            mingw: true
            msystem: UCRT64
            msys-packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-tcl
              mingw-w64-ucrt-x86_64-tk
          # Native arm64 Windows, with the GUI. An earlier version of this file
          # said the GUI could not be built here because Tcl/Tk had no arm64
          # Windows package. MSYS2's arm64 environment has both, which the
          # ElmerPost work turned up; the claim was wrong and only ever tested
          # against MSVC, which is a different question.
          - name: windows-arm64 (clang)
            os: windows-11-arm
            mingw: true
            msystem: CLANGARM64
            msys-packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-tcl
              mingw-w64-clang-aarch64-tk
          # macOS, through XQuartz, using the recipe proven on ElmerPost.
          # ElmerFront's non-Windows path is an X11 program and macOS has
          # neither X11 nor an X11 Tk; both are obtainable, which makes this a
          # cost rather than the impossibility this file used to claim.
          - name: macos-arm64 (clang, xquartz)
            os: macos-14
            macos-x11: true
            cmake-extra: >-
              -DOPENGL_INCLUDE_DIR=/opt/X11/include
              -DOPENGL_gl_LIBRARY=/opt/X11/lib/libGL.dylib
              -DOPENGL_glu_LIBRARY=/opt/X11/lib/libGLU.dylib
          - name: macos-x86_64 (clang, xquartz)
            os: macos-15-intel
            macos-x11: true
            cmake-extra: >-
              -DOPENGL_INCLUDE_DIR=/opt/X11/include
              -DOPENGL_gl_LIBRARY=/opt/X11/lib/libGL.dylib
              -DOPENGL_glu_LIBRARY=/opt/X11/lib/libGLU.dylib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            tcl-dev tk-dev \
            libx11-dev

      - name: clang (linux)
        if: matrix.apt-clang
        run: sudo apt-get install -y clang

      # Intel's compiler is here because the brief was every compiler,
      # proprietary ones included, not only the free ones.
      - name: intel oneapi
        if: matrix.intel
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
          echo "/opt/intel/oneapi/compiler/latest/bin" >> "$GITHUB_PATH"

      - name: dependencies (mingw)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.msys-packages }}

      # Homebrew's Tcl/Tk is Aqua and ElmerFront needs the X11 build, so Tk is
      # compiled against XQuartz. Same recipe as AltElmer/ElmerPost, where it
      # is already green on both macOS architectures.
      - name: cache the X11 Tcl/Tk (macos)
        if: matrix.macos-x11
        id: tcltk-cache
        uses: actions/cache@v4
        with:
          path: ~/tcltk-x11
          key: tcltk-x11-8.6.14-${{ matrix.os }}-v1

      - name: xquartz (macos)
        if: matrix.macos-x11
        run: |
          brew install --cask xquartz
          test -f /opt/X11/include/X11/Xlib.h || { echo "::error::XQuartz did not provide X11 headers"; exit 1; }
          test -f /opt/X11/include/GL/gl.h || { echo "::error::XQuartz did not provide GL/gl.h"; exit 1; }
          ls /opt/X11/lib/libGL* || { echo "::error::XQuartz did not provide libGL"; exit 1; }
          echo "XQuartz provides X11, GL headers and libGL"

      - name: build an X11 Tcl/Tk (macos)
        if: matrix.macos-x11 && steps.tcltk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=8.6.14
          PREFIX="$HOME/tcltk-x11"
          mkdir -p "$RUNNER_TEMP/tcltk" && cd "$RUNNER_TEMP/tcltk"
          curl -fsSL -o tcl.tar.gz "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tcl$V-src.tar.gz"
          curl -fsSL -o tk.tar.gz  "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tk$V-src.tar.gz"
          tar xzf tcl.tar.gz && tar xzf tk.tar.gz
          ( cd "tcl$V/unix" && ./configure --prefix="$PREFIX" >/dev/null && make -j3 >/dev/null && make install >/dev/null )
          # --enable-aqua=no is what makes this the X11 Tk rather than the
          # native one Homebrew ships.
          ( cd "tk$V/unix" && ./configure --prefix="$PREFIX" --with-tcl="$PREFIX/lib" \
              --enable-aqua=no --x-includes=/opt/X11/include --x-libraries=/opt/X11/lib >/dev/null \
            && make -j3 >/dev/null && make install >/dev/null )

      - name: the Tk built must be the X11 one (macos)
        if: matrix.macos-x11
        run: |
          set -e
          PREFIX="$HOME/tcltk-x11"
          lib=$(ls "$PREFIX"/lib/libtk8.6* | head -1)
          otool -L "$lib" | grep -qi 'libX11' \
            || { echo "::error::Tk does not link libX11; it came out as the Aqua build"; otool -L "$lib"; exit 1; }
          echo "ok: Tk links libX11, so it is the X11 build"
          tcllib=$(ls "$PREFIX"/lib/libtcl8.6* | head -1)
          tklib=$(ls "$PREFIX"/lib/libtk8.6* | head -1)
          {
            echo "MAC_TCLTK_ARGS=-DTCL_INCLUDE_PATH=$PREFIX/include -DTK_INCLUDE_PATH=$PREFIX/include -DTCL_LIBRARY=$tcllib -DTK_LIBRARY=$tklib -DTCL_TCLSH=$PREFIX/bin/tclsh8.6"
            echo "MAC_TCLTK_PREFIX=$PREFIX"
          } >> "$GITHUB_ENV"

      - name: build and test
        if: '!matrix.mingw'
        shell: bash
        run: |
          # Sourced only when it exists. "source missing-file || true" under
          # set -e behaves differently across shells and hides why a step died.
          if [ -f /opt/intel/oneapi/setvars.sh ]; then
            set +u
            . /opt/intel/oneapi/setvars.sh
            set -u
          fi
          echo "compilers: $(command -v cc) $(command -v c++)"
          echo "cmake: $(cmake --version | head -1)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-extra }} ${MAC_TCLTK_ARGS:-}

          # On macOS, prove the configure used the X11 Tcl/Tk built above and
          # not Apple's framework. CMP0074 is unset at this project's
          # cmake_minimum_required, so hints passed through TCL_ROOT are
          # ignored and FindTCL silently picks the framework in the Xcode SDK.
          # Without this check the job can go green having linked the Aqua Tk,
          # which is the one thing the XQuartz work exists to avoid.
          if [ -n "${MAC_TCLTK_PREFIX:-}" ]; then
            used=$(grep -E '^(TCL|TK)_(LIBRARY|INCLUDE_PATH):' build/CMakeCache.txt || true)
            echo "$used"
            echo "$used" | grep -qi 'framework' \
              && { echo "::error::configure picked Apple's Tcl/Tk framework, not the X11 build"; exit 1; }
            echo "$used" | grep -q "${MAC_TCLTK_PREFIX:-}" \
              || { echo "::error::Tcl/Tk did not come from ${MAC_TCLTK_PREFIX:-}"; exit 1; }
            echo "ok: using the X11 Tcl/Tk from ${MAC_TCLTK_PREFIX:-}"
          fi

          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: build and test (mingw)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: the executable and the core library must both exist
        shell: bash
        run: |
          set -e
          exe=$(find build -name 'ElmerFront' -type f -o -name 'ElmerFront.exe' -type f | head -1)
          lib=$(find build -name 'libelmerfront_core.a' -o -name 'elmerfront_core.lib' | head -1)
          echo "executable   : ${exe:-MISSING}"
          echo "core library : ${lib:-MISSING}"
          [ -n "$exe" ] || { echo "::error::ElmerFront was not built"; exit 1; }
          [ -n "$lib" ] || { echo "::error::the core library was not built"; exit 1; }

  # The 59 platform neutral sources on their own, with no OpenGL and no Tcl/Tk.
  # MSVC and clang-cl are here rather than in the matrix above because neither
  # Windows toolchain has a Tcl/Tk development package that can be installed in
  # a job without building it first. This is a real gap, and stating it as a
  # separate job rather than dropping those compilers keeps it visible.
  core:
    name: core only, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64 (msvc)
            os: windows-2022
          - name: windows-x86_64 (clang-cl)
            os: windows-2022
            cmake-extra: -T ClangCL
          # Native arm64 Windows. The core needs nothing beyond a compiler on
          # Windows, so it builds here for the same reason MSVC can build it at
          # all. The GUI does not: Tcl/Tk has no arm64 Windows development
          # package to install in a job.
          - name: windows-arm64 (msvc)
            os: windows-11-arm
          - name: linux-x86_64 (gcc)
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # X11 headers, even though the core needs neither OpenGL nor Tcl/Tk.
      # ecif_def.h includes <X11/Xlib.h> for the whole program whenever WIN32
      # is not defined, so on Unix the "platform neutral" sources are neutral
      # about the toolkit but not about the window system. That is how the
      # code has always been; noting it here rather than describing the core
      # as more portable than it is.
      - name: x11 headers (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: build the core library only
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DELMERFRONT_BUILD_GUI=OFF ${{ matrix.cmake-extra }}
          cmake --build build --config Release

      # ELMERFRONT_BUILD_GUI=OFF must actually mean no GUI. If the executable
      # appeared here the option would be doing nothing and this job would be
      # silently testing something else.
      - name: no executable may have been built
        shell: bash
        run: |
          lib=$(find build -name 'libelmerfront_core.a' -o -name 'elmerfront_core.lib' | head -1)
          exe=$(find build -name 'ElmerFront' -type f -o -name 'ElmerFront.exe' -type f | head -1)
          echo "core library : ${lib:-MISSING}"
          echo "executable   : ${exe:-none, as expected}"
          [ -n "$lib" ] || { echo "::error::the core library was not built"; exit 1; }
          [ -z "$exe" ] || { echo "::error::an executable was built with the GUI switched off"; exit 1; }

  # A clone without --recurse-submodules must say so clearly rather than
  # failing somewhere inside CMake with a message about a missing target.
  missing-submodules:
    name: a clone without submodules explains itself
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: configure must fail with the instruction, not a CMake internal error
        run: |
          if cmake -S . -B build 2> err.txt; then
            echo "::error::configure succeeded without the submodules"; exit 1
          fi
          cat err.txt
          grep -q 'git submodule update --init' err.txt \
            || { echo "::error::the message did not tell the user what to run"; exit 1; }
          echo "ok"
